<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fretboard</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f3efe8;--fg:#2a211a;--mut:#7a6c5f;--card:#fffaf2;--line:#d9cfc0;--acc:#b5532a;}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1713;--fg:#f0e8dc;--mut:#a39485;--card:#261f19;--line:#3d332a;--acc:#e08a55;}}
:root[data-theme="dark"]{--bg:#1c1713;--fg:#f0e8dc;--mut:#a39485;--card:#261f19;--line:#3d332a;--acc:#e08a55;}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--fg);font-family:Georgia,"Times New Roman",serif;line-height:1.5}
main{width:100%;margin:0;padding:20px 12px 32px}
h1{font-size:1.5rem;margin:0 0 4px;font-weight:600}
p.sub{margin:0 0 16px;color:var(--mut);font-size:.95rem}
.ctl{display:flex;flex-wrap:wrap;gap:12px;align-items:end;margin-bottom:14px}
label{display:flex;flex-direction:column;font-size:.8rem;color:var(--mut);gap:3px}
select,button{font:inherit;font-size:.95rem;padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--fg)}
button{cursor:pointer}
button:hover{border-color:var(--acc)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.circle{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.circle button{min-width:48px;padding:6px 8px}
.circle button[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:#fff}
.board{overflow:hidden;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px}
svg{display:block;width:100%;height:auto}
.chords{margin-top:14px}
.chords h2{font-size:.85rem;font-weight:400;color:var(--mut);margin:0 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.shapes{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
.shapes[hidden]{display:none}
.shapes span{font-size:.95rem}
.chip{display:flex;flex-direction:column;align-items:center;line-height:1.15;min-width:56px;padding:5px 9px}
.chip small{font-size:.7rem;color:var(--mut)}
.chip.new{border-color:#8e5bd6}
.chip[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:#fff}
.chip[aria-pressed="true"] small{color:#fff}
.info{margin-top:12px;font-size:1rem}
.info b{color:var(--acc)}
.nav{display:flex;gap:8px}
</style>
</head>
<body>
<main>
<h1>Fretboard</h1>
<p class="sub">Standard tuning, frets 0 to 23. Pick a key and a pattern, or step around the circle of fourths.</p>

<div class="circle" id="circle" role="group" aria-label="Keys in circle of fourths order"></div>

<div class="ctl">
  <label>Pattern
    <select id="pat"></select>
  </label>
  <label>Compare with
    <select id="cmp"><option value="-1">None</option></select>
  </label>
  <label>Labels
    <select id="lab"><option value="note">Note names</option><option value="int">Intervals (3m, 3M, 5)</option><option value="both">Note / Interval</option><option value="none">Dots only</option></select>
  </label>
</div>

<div class="board"><svg id="fb" viewBox="0 0 1400 270" role="img" aria-label="Guitar fretboard"></svg></div>
<div class="chords"><h2 id="chh">Chords</h2><div class="chips" id="chips"></div>
  <div class="shapes" id="shapes" hidden><span id="stxt"></span></div></div>
<p class="info" id="info"></p>
</main>

<script src="pentatonic.js"></script>
<script>
(function(){
var CIRCLE=["C","F","Bb","Eb","Ab","Db","Gb","B","E","A","D","G"];
var PC={C:0,F:5,Bb:10,Eb:3,Ab:8,Db:1,Gb:6,B:11,E:4,A:9,D:2,G:7};
var FLATKEYS=["F","Bb","Eb","Ab","Db","Gb"];
var SHARP=["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];
var FLAT=["C","Db","D","Eb","E","F","Gb","G","Ab","A","Bb","B"];
var INT=["1","2m","2M","3m","3M","4","5dim","5","6m","6M","7m","7M"];
var INTFULL=["Root","2 minor","2 Major","3 minor","3 Major","4 Perfect","5 diminished","5 Perfect","6 minor","6 Major","7 minor","7 Major"];
var PATS=[
 ["Minor pentatonic",[0,3,5,7,10],"minor"],
 ["Major scale",[0,2,4,5,7,9,11]],
 ["Blues scale",[0,3,5,6,7,10]]
];
var OPEN=Pentatonic.OPEN, NF=Pentatonic.NF; // high e to low E, top to bottom
var NUT=76, END=1380, TOP=34, GAP=34;
var CT=[["",[0,4,7]],["m",[0,3,7]],["dim",[0,3,6]],["7",[0,4,7,10]],["maj7",[0,4,7,11]],["m7",[0,3,7,10]],["m7b5",[0,3,6,10]]];
var state={key:"C",pat:0,chord:null,shape:0,secHover:-1};
var lastChipSig=null;

var circle=document.getElementById("circle"), pat=document.getElementById("pat");
CIRCLE.forEach(function(k){
  var b=document.createElement("button");
  b.textContent=k; b.setAttribute("aria-pressed","false"); b.dataset.k=k;
  b.onclick=function(){state.key=k;state.shape=0;state.hover=null;draw();};
  circle.appendChild(b);
});
PATS.forEach(function(p,i){var o=document.createElement("option");o.value=i;o.textContent=p[0];pat.appendChild(o);});
var cmp=document.getElementById("cmp");
PATS.forEach(function(p,i){var o=document.createElement("option");o.value=i;o.textContent=p[0];cmp.appendChild(o);});
cmp.onchange=function(){state.shape=0;state.hover=null;draw();};
pat.value=state.pat;
document.getElementById("lab").value="both";
pat.onchange=function(){state.pat=+pat.value;state.shape=0;state.hover=null;draw();};
document.getElementById("lab").onchange=draw;

function fx(n){ // x of fret wire n, uniform spacing
  return NUT+(END-NUT)*n/NF;
}
// playable shapes: one note per string, adjacent strings, root in the bass, fretted notes within 4 frets
function voicings(root,rv,tones){
  var res=[];
  for(var a=0;a<6;a++)for(var b=a+2;b<6;b++)(function(a,b){
    var cur=[];
    (function dfs(s,lo,hi){
      if(s>b){
        if(hi>4&&cur.indexOf(0)>=0)return;
        if(((OPEN[b]+cur[b-a])%12-root+12)%12!==rv)return;
        for(var i=0;i<tones.length;i++){var ok=false;for(var j=0;j<cur.length;j++)if(((OPEN[a+j]+cur[j])%12-root+12)%12===tones[i])ok=true;if(!ok)return;}
        var fr=[-1,-1,-1,-1,-1,-1];cur.forEach(function(f,j){fr[a+j]=f;});
        var op=cur.indexOf(0)>=0;res.push({fr:fr,cnt:cur.length,op:op,lo:op?0:(lo===99?0:lo),hi:hi<0?0:hi});return;
      }
      for(var f=0;f<=NF;f++){
        if(tones.indexOf(((OPEN[s]+f)%12-root+12)%12)<0)continue;
        var nl=lo,nh=hi;
        if(f>0){nl=Math.min(lo,f);nh=Math.max(hi,f);if(nh-nl>3)continue;}
        cur[s-a]=f;dfs(s+1,nl,nh);
      }
      cur.length=s-a;
    })(a,99,-1);
  })(a,b);
  res.sort(function(x,y){return x.lo-y.lo||y.cnt-x.cnt||(x.hi-x.lo)-(y.hi-y.lo);});
  return res;
}
// the five movable pentatonic positions live in pentatonic.js (Pentatonic.pentShapes)
function el(t,a,txt){
  var e=document.createElementNS("http://www.w3.org/2000/svg",t);
  for(var k in a)e.setAttribute(k,a[k]);
  if(txt!=null)e.textContent=txt;return e;
}
function secFrets(notes){
  var a=[];
  for(var s=5;s>=0;s--){
    var fs=[];
    for(var f=0;f<=NF;f++)if(notes[s+"|"+f])fs.push(f);
    a.push(fs.length?fs.join(" "):"x");
  }
  return a.join("  ");
}
function draw(){
  var svg=document.getElementById("fb");svg.innerHTML="";
  var root=PC[state.key], base=PATS[state.pat][1], ci=+cmp.value, oth=ci>=0?PATS[ci][1]:null, pc=oth?base.concat(oth.filter(function(i){return base.indexOf(i)<0;})):base, names=FLATKEYS.indexOf(state.key)>=0?FLAT:SHARP;
  var lab=document.getElementById("lab").value, reg=[0,NF];
  var bottom=TOP+GAP*5;
  Array.prototype.forEach.call(circle.children,function(b){b.setAttribute("aria-pressed",b.dataset.k===state.key?"true":"false");});

  svg.appendChild(el("rect",{x:NUT,y:TOP-14,width:END-NUT,height:bottom-TOP+28,fill:"#4a2c1d",rx:3}));
  svg.appendChild(el("rect",{x:NUT-6,y:TOP-14,width:6,height:bottom-TOP+28,fill:"#e8dcc4"}));
  // inlays
  [3,5,7,9,15,17,19,21].forEach(function(n){svg.appendChild(el("circle",{cx:(fx(n-1)+fx(n))/2,cy:(TOP+bottom)/2,r:7,fill:"#e8dcc4",opacity:.35}));});
  [-1,1].forEach(function(s){svg.appendChild(el("circle",{cx:(fx(11)+fx(12))/2,cy:(TOP+bottom)/2+s*GAP*1.1,r:6,fill:"#e8dcc4",opacity:.35}));});
  // frets
  for(var n=1;n<=NF;n++)svg.appendChild(el("line",{x1:fx(n),x2:fx(n),y1:TOP-14,y2:bottom+14,stroke:"#b9b2a6","stroke-width":2}));
  // strings
  for(var s=0;s<6;s++)svg.appendChild(el("line",{x1:NUT-6,x2:END,y1:TOP+s*GAP,y2:TOP+s*GAP,stroke:"#d8d2c6","stroke-width":1+s*.45}));
  // fret numbers
  [3,5,7,9,12,15,17,19,21,23].forEach(function(n){svg.appendChild(el("text",{x:(fx(n-1)+fx(n))/2,y:bottom+34,"text-anchor":"middle","font-size":16,fill:"var(--mut)"},n));});
  // chords built only from notes in the pattern
  var chips=document.getElementById("chips"), chh=document.getElementById("chh");
  var chordSet=null, chosen=null, list=[];
  if(pc.length<=8){
    pc.slice().sort(function(a,b){return a-b;}).forEach(function(rv){
      CT.forEach(function(ct,ti){
        var tones=ct[1].map(function(x){return (rv+x)%12;});
        if(tones.every(function(t){return pc.indexOf(t)>=0;}))list.push({id:rv+"|"+ti,name:names[(root+rv)%12]+ct[0],rv:rv,tones:tones,nw:!!oth&&tones.some(function(t){return base.indexOf(t)<0;})});
      });
    });
  }
  if(state.chord&&!list.some(function(c){return c.id===state.chord;}))state.chord=null;
  var active=state.chord;
  chh.textContent=pc.length>8?"Chords (not shown for this many notes)":"Chords made only from these notes"+(oth?" (purple border = uses an added note)":"")+" - tap one, then hover a shape on the fretboard to isolate it";
  var chipSig=state.key+"|"+state.pat+"|"+cmp.value+"|"+pc.join(",");
  var rebuild=chipSig!==lastChipSig;lastChipSig=chipSig;
  if(rebuild)chips.innerHTML="";
  var chipEls={};
  list.forEach(function(c,i){
    var b;
    if(rebuild){
      b=document.createElement("button");b.className="chip"+(c.nw?" new":"");
      b.innerHTML=c.name+"<small>"+INT[c.rv]+"</small>";
      b.onclick=function(){state.chord=state.chord===c.id?null:c.id;state.shape=0;state.secHover=-1;draw();};
      chips.appendChild(b);
    }else b=chips.children[i];
    b.setAttribute("aria-pressed",c.id===active?"true":"false");
    chipEls[c.id]=b;
    if(c.id===active){chordSet=c.tones;chosen=c;}
  });
  var vset=null, noteEls={}, secEls=[], shp=document.getElementById("shapes");
  shp.hidden=true;
  var secDefs=[], stxt=document.getElementById("stxt");
  if(chosen){
    var vl=voicings(root,chosen.rv,chosen.tones), best=0;
    vl.forEach(function(v){if(v.cnt>best)best=v.cnt;});
    // pick a chain of shapes up the neck: shapes may overlap a little, each one favours more strings and a tighter span
    var minc=Math.min(4,best), picked=[];
    var cs=vl.filter(function(v){return v.cnt>=minc;}).sort(function(x,y){return x.lo-y.lo||x.hi-y.hi;}), sc=[], pr=[];
    cs.forEach(function(v,i){
      var bj=-1,bs=0;
      for(var j=0;j<i;j++)if(v.lo>=cs[j].lo+2&&v.hi>cs[j].hi&&sc[j]>bs){bs=sc[j];bj=j;}
      sc[i]=v.cnt*4-(v.hi-v.lo)+bs;pr[i]=bj;
    });
    var bi=-1,bm=-1;
    sc.forEach(function(x,i){if(x>bm){bm=x;bi=i;}});
    while(bi>=0){picked.unshift(cs[bi]);bi=pr[bi];}
    shp.hidden=false;
    if(!picked.length)stxt.textContent="No shape of this chord fits within 4 frets";
    else{
      vset={};
      picked.forEach(function(v){
        var notes={};
        v.fr.forEach(function(f,si){if(f>=0){vset[si+"|"+f]=true;notes[si+"|"+f]=true;}});
        secDefs.push({notes:notes,minF:v.lo,maxF:v.hi,hasOpen:v.op,id:chosen.id});
      });
    }
  }else{
    var ptype=PATS[state.pat][2];
    if(ptype){secDefs=Pentatonic.pentShapes(root,ptype);shp.hidden=false;}
  }
  var secText=[];
  secDefs.forEach(function(sec,n){
    var top=99,bot=-1;
    for(var k in sec.notes){var si=+k.split("|")[0];if(si<top)top=si;if(si>bot)bot=si;}
    var x1=sec.hasOpen?NUT-58:fx(sec.minF-1)+3, x2=fx(sec.maxF)-3, y1=TOP+top*GAP-20, hh=(bot-top)*GAP+40;
    var g=el("g",{});
    var fill=el("rect",{x:x1,y:y1,width:x2-x1,height:hh,rx:9,fill:n%2?"#ffd27a":"#ffffff",opacity:.05,"pointer-events":"none"});
    var line=el("rect",{x:x1,y:y1,width:x2-x1,height:hh,rx:9,fill:"none",stroke:n%2?"#ffd27a":"#fff","stroke-width":1.2,"stroke-dasharray":"6 4",opacity:.4,"pointer-events":"none"});
    var label=el("text",{x:(x1+x2)/2,y:y1-6,"text-anchor":"middle","font-size":13,fill:"var(--fg)","pointer-events":"none"},sec.label||(n+1));
    var hit=el("rect",{x:x1,y:y1,width:x2-x1,height:hh,rx:9,fill:"transparent","pointer-events":"all",cursor:"pointer"});
    g.appendChild(fill);g.appendChild(line);g.appendChild(label);g.appendChild(hit);
    svg.appendChild(g);
    var idx=secEls.length;
    secEls.push({fill:fill,line:line,label:label,notes:sec.notes,id:sec.id});
    hit.addEventListener("mouseenter",function(){setSectionHover(idx);});
    hit.addEventListener("mouseleave",function(){setSectionHover(-1);});
    secText.push((sec.label||(n+1))+") frets "+secFrets(sec.notes));
  });
  if(secDefs.length){
    stxt.textContent=(chosen?"overlapping outlines alternate white and yellow; each shape has one note per string: ":"5 pentatonic positions - hover a shape to isolate it: ")+secText.join("   ");
  }
  // notes
  for(var s2=0;s2<6;s2++){
    for(var f=0;f<=NF;f++){
      var p=(OPEN[s2]+f)%12, iv=(p-root+12)%12;
      if(pc.indexOf(iv)<0)continue;
      var x=f===0?NUT-30:(fx(f-1)+fx(f))/2, y=TOP+s2*GAP, isRoot=iv===0;
      var inReg=f>=reg[0]&&f<=reg[1];
      var inCh=vset?!!vset[s2+"|"+f]:false;
      var g=el("g",{opacity:vset?(inCh?1:.2):1,"pointer-events":"none"});
      noteEls[s2+"|"+f]=g;
      var st="same";
      if(oth){var inB=base.indexOf(iv)>=0,inO=oth.indexOf(iv)>=0;st=inB&&inO?"same":inO?"added":"removed";}
      var fill=isRoot?"#e8a33d":st==="added"?"#8e5bd6":st==="removed"?"#4a2c1d":"#2f7d79";
      var stk=isRoot?"#7a4a0a":st==="added"?"#4b2a85":st==="removed"?"#e58a8a":"#16403d";
      var dash=st==="removed"?"4 3":"none", sw=1.5;
      if(inCh){stk="#fff";sw=3.5;}
      if(lab==="both")g.appendChild(el("rect",{x:x-23,y:y-14,width:46,height:28,rx:14,fill:fill,stroke:stk,"stroke-width":sw,"stroke-dasharray":dash}));
      else g.appendChild(el("circle",{cx:x,cy:y,r:15,fill:fill,stroke:stk,"stroke-width":sw,"stroke-dasharray":dash}));
      var t=lab==="note"?names[p]:lab==="int"?INT[iv]:names[p]+"/"+INT[iv];
      if(lab!=="none")g.appendChild(el("text",{x:x,y:y+4,"text-anchor":"middle","font-size":lab==="both"?10:lab==="int"?12:14,"font-weight":600,fill:isRoot?"#2a1a05":"#fff"},t));
      svg.appendChild(g);
    }
  }
  function setSectionHover(i){
    state.secHover=i;
    for(var k in noteEls){
      var base=vset?(vset[k]?1:.2):1;
      noteEls[k].setAttribute("opacity",i<0?base:(secEls[i].notes[k]?1:.1));
    }
    secEls.forEach(function(s,j){
      var on=i<0?null:j===i;
      s.fill.setAttribute("opacity",on===true?.18:on===false?.03:.05);
      s.line.setAttribute("opacity",on===true?1:on===false?.18:.4);
      s.line.setAttribute("stroke-width",on===true?3:1.2);
      s.label.setAttribute("opacity",on===false?.3:1);
    });
    var hi=state.chord;
    if(i>=0&&secEls[i])hi=secEls[i].id;
    for(var id in chipEls)chipEls[id].setAttribute("aria-pressed",id===hi?"true":"false");
  }
  var nn=pc.map(function(i){return names[(root+i)%12];}).join("  ");
  var nxt=CIRCLE[(CIRCLE.indexOf(state.key)+1)%12];
  document.getElementById("info").innerHTML="<b>"+state.key+" "+PATS[state.pat][0].toLowerCase()+"</b>: "+nn+".<br>Intervals: "+pc.map(function(i){return INTFULL[i];}).join(", ")+"."+(oth?"<br>Compared with <b>"+PATS[ci][0].toLowerCase()+"</b>: <span style=\"color:#8e5bd6\"><b>added</b></span> "+(oth.filter(function(i){return base.indexOf(i)<0;}).map(function(i){return INTFULL[i];}).join(", ")||"nothing")+"; <span style=\"color:#d97a7a\"><b>removed</b></span> "+(base.filter(function(i){return oth.indexOf(i)<0;}).map(function(i){return INTFULL[i];}).join(", ")||"nothing")+". Purple = only in the compared pattern, dashed outline = only in the first.":"")+"<br>Next key in the circle: <b>"+nxt+"</b>.";
}
draw();
})();
</script>
</body>
</html>
